<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>COCO Lab and COCO-Bench: architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4652"/>
    </marker>
    <style>
      .box { fill:#ffffff; stroke:#3b4652; stroke-width:1.4; rx:8; }
      .model { fill:#eaf4ee; }
      .stack { fill:#fbf0e3; }
      .ci { fill:#eef1fa; }
      .h { font-weight:700; font-size:14px; fill:#1c2530; }
      .t { fill:#3b4652; }
      .tag { font-weight:700; font-size:11px; letter-spacing:1px; }
      .l { stroke:#3b4652; stroke-width:1.4; fill:none; marker-end:url(#a); }
    </style>
  </defs>
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="24" y="34" class="h" font-size="18">COCO Lab · COCO-Bench — one model, two evidence classes, everything re-runnable</text>

  <!-- World Spec -->
  <rect x="24" y="64" width="210" height="96" class="box"/>
  <text x="38" y="88" class="h">World Spec (YAML)</text>
  <text x="38" y="108" class="t">Arena, Depot, cluttered Depot</text>
  <text x="38" y="126" class="t">authored once, compiled to</text>
  <text x="38" y="144" class="t">model grid · SDF · Nav2 map</text>

  <!-- Browser -->
  <rect x="290" y="64" width="446" height="250" class="box model"/>
  <text x="304" y="88" class="tag" fill="#2f7a4e">MODEL · BROWSER</text>
  <text x="304" y="110" class="h">Web app: Play · Compare · Workbench · Studio</text>
  <rect x="304" y="126" width="190" height="92" class="box"/>
  <text x="316" y="148" class="h">Model worker</text>
  <text x="316" y="166" class="t">coco_lab in Pyodide</text>
  <text x="316" y="184" class="t">kinematics · costmaps ·</text>
  <text x="316" y="202" class="t">planners · controllers · filters</text>
  <rect x="506" y="126" width="190" height="92" class="box"/>
  <text x="518" y="148" class="h">User-code sandbox</text>
  <text x="518" y="166" class="t">your plan()/control()/localise()</text>
  <text x="518" y="184" class="t">no network, DOM, storage;</text>
  <text x="518" y="202" class="t">time + memory limits</text>
  <text x="304" y="244" class="t">every tick hashed → a hash chain per run</text>
  <text x="304" y="264" class="t">experiments = links that reproduce exactly</text>
  <text x="304" y="284" class="t">(same chains in 4 browser engines and CPython)</text>

  <!-- Native / CI parity -->
  <rect x="776" y="64" width="200" height="110" class="box ci"/>
  <text x="788" y="88" class="tag" fill="#3b55a0">CI</text>
  <text x="788" y="108" class="h">Native parity</text>
  <text x="788" y="128" class="t">coco experiment run (CPython)</text>
  <text x="788" y="146" class="t">same chains as the browser,</text>
  <text x="788" y="164" class="t">checked on every change</text>

  <!-- Bench -->
  <rect x="24" y="200" width="210" height="114" class="box"/>
  <text x="38" y="224" class="h">COCO-Bench v1</text>
  <text x="38" y="244" class="t">frozen suites + datasheets</text>
  <text x="38" y="262" class="t">tiers from measurable features</text>
  <text x="38" y="280" class="t">reference results (MODEL)</text>
  <text x="38" y="298" class="t">planning · control · localisation</text>

  <!-- Leaderboard -->
  <rect x="290" y="350" width="420" height="130" class="box ci"/>
  <text x="304" y="374" class="tag" fill="#3b55a0">CI · LEADERBOARD</text>
  <text x="304" y="396" class="h">A pull request adds one algorithm file</text>
  <text x="304" y="416" class="t">① sandboxed verify: no network, unprivileged, read-only container</text>
  <text x="304" y="436" class="t">② held-out run: scenarios from a secret, made outside the sandbox</text>
  <text x="304" y="456" class="t">③ trusted writer: validates numbers as data, labels the PR</text>

  <!-- ROS 2 -->
  <rect x="776" y="230" width="200" height="250" class="box stack"/>
  <text x="788" y="254" class="tag" fill="#a0612b">STACK · SIMULATION</text>
  <text x="788" y="276" class="h">ROS 2 Jazzy + Nav2</text>
  <text x="788" y="294" class="h">in Gazebo Harmonic</text>
  <text x="788" y="318" class="t">your file, unchanged, as a</text>
  <text x="788" y="336" class="t">ROS 2 node serving</text>
  <text x="788" y="354" class="t">ComputePathToPose,</text>
  <text x="788" y="372" class="t">FollowPath, or AMCL's role</text>
  <text x="788" y="396" class="t">cmd_vel_arbiter: the only</text>
  <text x="788" y="414" class="t">wheel publisher</text>
  <text x="788" y="440" class="t">same worlds and scenarios</text>
  <text x="788" y="458" class="t">→ the model-vs-ROS 2 gap</text>

  <!-- Paper -->
  <rect x="24" y="350" width="210" height="130" class="box"/>
  <text x="38" y="374" class="h">The paper</text>
  <text x="38" y="394" class="t">every number a macro</text>
  <text x="38" y="412" class="t">generated from committed data</text>
  <text x="38" y="430" class="t">CI: `make check` + PDF build</text>
  <text x="38" y="448" class="t">"Reproduce this paper" link</text>

  <!-- arrows -->
  <path d="M234 112 L290 140" class="l"/>
  <path d="M129 64 L129 50 L990 50 L990 300 L978 300" class="l"/>
  <path d="M234 257 L290 230" class="l"/>
  <path d="M736 150 L776 130" class="l"/>
  <path d="M600 218 L600 350" class="l"/>
  <path d="M696 190 L756 190 L756 300 L776 300" class="l"/>
  <path d="M776 455 L710 430" class="l"/>
  <path d="M290 420 L234 415" class="l"/>
  <text x="608" y="337" class="t" font-size="11">submit</text>
  <text x="742" y="322" class="t" font-size="10">Export</text>
  <text x="742" y="334" class="t" font-size="10">ROS 2</text>

  <text x="24" y="520" class="t">Labels everywhere: MODEL = the browser/Python model (kinematic) · STACK = full ROS 2 in Gazebo (a simulation).</text>
  <text x="24" y="540" class="t">No physical robot exists; nothing here is a hardware result. Failures are kept visible (e.g. a planner that wins in MODEL and fails in STACK).</text>
  <text x="24" y="580" class="t" font-size="11">github.com/GauthamCodes/coco-labs · gauthamcodes.github.io/coco-labs · Apache-2.0</text>
</svg>
