# Tailscale Funnel sidecar for a remote COCO Live session (owner's choice,
# 2026-10-03). Phase 2 Part C3; docs/live/tunnel/README.md.
#
#   COCO_TS_STATE=$HOME/coco_tailscale_state \
#   docker compose -f docker-compose.yml -f docker-compose.remote.yml \
#     -f docs/live/tunnel/tailscale/docker-compose.tunnel-tailscale.yml up -d
#
# The node is logged in ONCE with docs/live/tunnel/tailscale/ts.sh login
# (state persists in COCO_TS_STATE); TS_AUTHKEY is optional.
#
# serve.json (beside this file) routes /ws and /healthz ONLY, to coco:8080
# on the compose network -- the same platform_server the host publishes on
# 127.0.0.1:8080 -- and turns Funnel on for 443. Userspace networking (no
# TUN device, no Tailscale SSH). NOT --shields-up: Tailscale refuses to turn
# Funnel on while it is set (measured 2026-10-03, "Unable to turn on Funnel
# while shields-up is enabled"). Shields-up only ever governed connections
# from the owner's own tailnet devices, never the internet. Runs as the
# host user with every capability dropped. No host network, no
# published ports, no Docker socket.
services:
  tunnel:
    image: tailscale/tailscale:${COCO_TAILSCALE_TAG:-v1.102.5}
    container_name: coco-tunnel
    hostname: coco-live
    user: "${COCO_TS_UID:-1000}:${COCO_TS_GID:-1000}"
    environment:
      TS_AUTHKEY: "${TS_AUTHKEY:-}"
      TS_HOSTNAME: "coco-live"
      TS_STATE_DIR: "/var/lib/tailscale"
      TS_SOCKET: "/tmp/tailscaled.sock"
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: "/config/serve.json"
      # tag:coco-live is the ONE node the policy file grants `funnel`.
      # --reset: every start asserts exactly these settings, never ones a
      # previous run left in the state (measured: a stale --shields-up
      # made `tailscale up` refuse and the sidecar exit).
      TS_EXTRA_ARGS: "--reset --advertise-tags=tag:coco-live"
    volumes:
      - ${COCO_TS_STATE:?set COCO_TS_STATE to the persistent state dir}:/var/lib/tailscale
      - ./docs/live/tunnel/tailscale/serve.json:/config/serve.json:ro
    depends_on:
      coco:
        condition: service_healthy
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
