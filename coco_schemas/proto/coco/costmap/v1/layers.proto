syntax = "proto3";
package coco.costmap.v1;

// MODEL, independent Compare grid. No unknown-space or persistent scan marks.
message LayersHeader {
  string map_id = 1;
  uint32 width = 2;
  uint32 height = 3;
  double resolution = 4;
  double origin_x = 5;
  double origin_y = 6;
  bool row0_is_bottom = 7;
  double inflation_radius = 8;
  double cost_scaling_factor = 9;
  double robot_radius = 10; // circular inscribed radius, metres
}

// One row per cell; all four layers share the header's geometry and update.
// Costs: 0 free, 1..252 traversable, 253 inscribed, 254 lethal.
message LayersBatch {
  repeated uint64 seq = 1;
  repeated uint64 tick = 2;
  repeated double t_world = 3;
  repeated uint32 row = 4;
  repeated uint32 col = 5;
  repeated uint32 static_cost = 6;
  repeated uint32 obstacle_cost = 7;
  repeated uint32 inflation_cost = 8;
  repeated uint32 combined_cost = 9;
  string map_id = 10;
  uint64 update = 11;
}
