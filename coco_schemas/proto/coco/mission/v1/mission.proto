// A mission's state machine (M2.1): every transition with the event that
// caused it and a human-readable reason (the Arena fetch mission: localise,
// choose a bay, plan, local control, detect, grasp, return).
// Family mission.fsm. Channels:
//   coco.mission.fsm.header.v1      (MissionHeader, static): the states, in order
//   coco.mission.fsm.transition.v1  (TransitionBatch)

syntax = "proto3";

package coco.mission.v1;

import "coco/common/v1/common.proto";

message MissionHeader {
  string mission_id = 1;
  repeated string states = 2;       // the nominal order
  coco.common.v1.Params params = 3; // e.g. the target colour, timeouts
  string evidence = 4;              // "MODEL" (the Arena) or "STACK" (a recorded executive)
}

message TransitionBatch {
  repeated uint64 seq = 1;
  repeated uint64 tick = 2;
  repeated double t_world = 3;
  repeated string from_state = 4;
  repeated string to_state = 5;
  repeated string event = 6;        // what caused it: "plan_found", "target_detected", "timeout", ...
  repeated string reason = 7;       // why, in words a learner can read
  repeated string result = 8;       // "" or a terminal result: "fetch", "failed: ..."
  string mission_id = 9;
}
