// What a person did: goals, teleop, choices. An Arena run is fully
// reproduced by its spec, its seed and this log (README section 5.2).
// Channel: coco.input.events.v1 (InputEventBatch).

syntax = "proto3";

package coco.input.v1;

enum InputKind {
  INPUT_KIND_UNSPECIFIED = 0;
  INPUT_KIND_GOAL = 1;       // x, y (theta if has_theta)
  INPUT_KIND_TELEOP = 2;     // linear, angular: held until the next teleop row
  INPUT_KIND_STOP = 3;       // stop now; clears any goal
  INPUT_KIND_PLANNER = 4;    // choice = the planner's name
  INPUT_KIND_RESET = 5;      // back to the spec's start pose
  INPUT_KIND_KIDNAP = 6;     // x, y (theta if has_theta): the robot is carried; odometry is not told (M2.3)
  INPUT_KIND_CONFIG = 7;     // choice = "key=value": switch on or tune a whole-loop subsystem (M2.3)
}

// One row per input, applied at the START of `tick` (before that tick's step).
message InputEventBatch {
  repeated uint64 seq = 1;
  repeated uint64 tick = 2;
  repeated double t_world = 3;
  repeated InputKind kind = 4;
  repeated double x = 5;
  repeated double y = 6;
  repeated double theta = 7;
  repeated bool has_theta = 8;
  repeated double linear = 9;
  repeated double angular = 10;
  repeated string choice = 11;
}
