<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" preserveAspectRatio="xMidYMid slice">
 <defs>
  <linearGradient id="ceil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07090d"/><stop offset="1" stop-color="#121826"/></linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2130"/><stop offset="1" stop-color="#262e3c"/></linearGradient>
  <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffcf8a" stop-opacity=".28"/><stop offset="1" stop-color="#ffcf8a" stop-opacity="0"/></radialGradient>
  <radialGradient id="dock" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#9fd0ff" stop-opacity=".22"/><stop offset="1" stop-color="#9fd0ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#34D399" stop-opacity=".9"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/></radialGradient>
  <radialGradient id="head" cx="0.5" cy="1" r="1"><stop offset="0" stop-color="#fff3d6" stop-opacity=".35"/><stop offset="1" stop-color="#fff3d6" stop-opacity="0"/></radialGradient>
  <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E1116" stop-opacity=".0"/><stop offset=".45" stop-color="#1c2a3d" stop-opacity=".55"/><stop offset=".6" stop-color="#0E1116" stop-opacity="0"/></linearGradient>
  <pattern id="haz" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="24" fill="#FACC15"/><rect x="12" width="12" height="24" fill="#111"/></pattern>
  <pattern id="mesh" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 0L10 10M10 0L0 10" stroke="#5b6678" stroke-width=".8"/></pattern>
 </defs>
 <rect width="1600" height="720" fill="url(#ceil)"/>
 <!-- ceiling fixtures -->
 <g stroke="#ffd59a" stroke-width="5" stroke-linecap="round" opacity=".95">
  <line x1="520" y1="70" x2="700" y2="70"/><line x1="900" y1="70" x2="1080" y2="70"/>
  <line x1="610" y1="160" x2="720" y2="160"/><line x1="880" y1="160" x2="990" y2="160"/>
  <line x1="680" y1="215" x2="740" y2="215"/><line x1="860" y1="215" x2="920" y2="215"/>
 </g>
 <!-- back wall -->
 <rect x="560" y="250" width="480" height="120" fill="#141b27"/>
 <g stroke="#232c3b" stroke-width="2"><line x1="620" y1="250" x2="620" y2="370"/><line x1="680" y1="250" x2="680" y2="370"/><line x1="740" y1="250" x2="740" y2="370"/><line x1="800" y1="250" x2="800" y2="370"/><line x1="860" y1="250" x2="860" y2="370"/><line x1="920" y1="250" x2="920" y2="370"/><line x1="980" y1="250" x2="980" y2="370"/></g>
 <rect x="560" y="300" width="480" height="4" fill="#2e3a4e"/>
 <!-- roll-up dock door + light -->
 <rect x="890" y="285" width="90" height="85" fill="#202a38"/><g stroke="#2f3b4f" stroke-width="2"><line x1="890" y1="300" x2="980" y2="300"/><line x1="890" y1="315" x2="980" y2="315"/><line x1="890" y1="330" x2="980" y2="330"/><line x1="890" y1="345" x2="980" y2="345"/><line x1="890" y1="360" x2="980" y2="360"/></g>
 <ellipse cx="935" cy="400" rx="160" ry="40" fill="url(#dock)"/>
 <!-- EXIT -->
 <rect x="640" y="268" width="54" height="22" rx="3" fill="#0b2a1c" stroke="#34D399"/><text x="667" y="284" fill="#6ff0b6" font-family="Chakra Petch" font-size="14" font-weight="700" text-anchor="middle">EXIT</text>
 <!-- floor -->
 <polygon points="560,370 1040,370 1600,720 0,720" fill="url(#floor)"/>
 <ellipse cx="800" cy="470" rx="260" ry="50" fill="url(#pool)"/><ellipse cx="800" cy="610" rx="480" ry="90" fill="url(#pool)"/>
 <!-- lane lines -->
 <polygon points="700,370 712,370 420,720 380,720" fill="#d8b23a" opacity=".55"/>
 <polygon points="888,370 900,370 1220,720 1180,720" fill="#d8b23a" opacity=".55"/>
 <!-- hazard crossing -->
 <polygon points="640,455 960,455 990,485 610,485" fill="url(#haz)" opacity=".75"/>
 <!-- zone number -->
 <text x="800" y="430" fill="#cfd6e3" opacity=".22" font-family="Chakra Petch" font-weight="700" font-size="44" text-anchor="middle" transform="matrix(1 0 0 .45 0 236)">A1</text>
 <!-- racks left -->
 <g>
  <polygon points="560,370 600,370 600,180 560,150" fill="#1d2533"/>
  <polygon points="380,470 560,370 560,150 380,60" fill="#232c3c"/>
  <polygon points="100,620 380,470 380,60 100,-60" fill="#283244"/>
  <g stroke="#e2742a" stroke-width="5"><line x1="100" y1="250" x2="380" y2="215"/><line x1="100" y1="440" x2="380" y2="340"/><line x1="380" y1="215" x2="560" y2="200"/><line x1="380" y1="340" x2="560" y2="285"/></g>
  <g fill="#9b7a52"><polygon points="130,430 220,410 220,330 130,345"/><polygon points="240,405 330,385 330,300 240,320"/><polygon points="400,330 470,315 470,255 400,268"/></g>
  <g fill="#c9d3df" opacity=".75"><polygon points="140,240 230,228 230,160 140,170"/><polygon points="260,225 350,213 350,150 260,160"/></g>
  <g fill="#3d6fb6"><polygon points="410,205 480,198 480,150 410,156"/></g>
 </g>
 <!-- racks right (mirrored) -->
 <g transform="translate(1600 0) scale(-1 1)">
  <polygon points="560,370 600,370 600,180 560,150" fill="#1d2533"/>
  <polygon points="380,470 560,370 560,150 380,60" fill="#232c3c"/>
  <polygon points="100,620 380,470 380,60 100,-60" fill="#283244"/>
  <g stroke="#e2742a" stroke-width="5"><line x1="100" y1="250" x2="380" y2="215"/><line x1="100" y1="440" x2="380" y2="340"/><line x1="380" y1="215" x2="560" y2="200"/><line x1="380" y1="340" x2="560" y2="285"/></g>
  <g fill="#a35a3a"><polygon points="130,430 220,410 220,330 130,345"/><polygon points="400,330 470,315 470,255 400,268"/></g>
  <g fill="#c9d3df" opacity=".75"><polygon points="240,405 330,385 330,300 240,320"/><polygon points="140,240 230,228 230,160 140,170"/></g>
 </g>
 <rect width="1600" height="720" fill="url(#fog)"/>
 <!-- drop zone -->
 <g transform="translate(980 530)"><polygon points="-90,-25 90,-25 120,30 -120,30" fill="#34D399" fill-opacity=".14" stroke="#34D399" stroke-width="3" stroke-dasharray="14 8"/><text x="0" y="12" fill="#34D399" font-family="Chakra Petch" font-weight="700" font-size="20" text-anchor="middle">DOCK 2</text></g>
 <!-- plan ribbon -->
 <path d="M800 650 C 800 590, 760 540, 735 505" stroke="#F43F8E" stroke-width="9" fill="none" stroke-linecap="round" opacity=".9"/>
 <g fill="#ffd1e6"><polygon points="796,612 806,612 801,602"/><polygon points="780,568 790,566 783,557"/></g>
 <!-- target can -->
 <ellipse cx="732" cy="500" rx="38" ry="12" fill="url(#glow)"/>
 <ellipse cx="732" cy="500" rx="30" ry="9" fill="none" stroke="#34D399" stroke-width="3"/>
 <rect x="725" y="468" width="14" height="32" rx="3" fill="#d03a2f"/><ellipse cx="732" cy="468" rx="7" ry="2.5" fill="#ff8a7a"/>
 <polygon points="724,448 740,448 732,458" fill="#34D399"/>
 <!-- LiDAR fan (faint) -->
 <path d="M800 660 L 560 520 A 300 120 0 0 1 1040 520 Z" fill="#22D3EE" fill-opacity=".05"/>
 <!-- COCO -->
 <ellipse cx="800" cy="688" rx="78" ry="16" fill="#000" opacity=".45"/>
 <path d="M800 640 L 700 520 L 900 520 Z" fill="url(#head)"/>
 <g transform="translate(800 650)">
  <rect x="-62" y="-20" width="124" height="44" rx="10" fill="#2a3242"/>
  <rect x="-62" y="-20" width="124" height="10" rx="5" fill="#FF7A1A"/>
  <rect x="-40" y="16" width="80" height="4" rx="2" fill="#34D399"/>
  <rect x="-70" y="0" width="14" height="32" rx="4" fill="#0f1218"/><rect x="56" y="0" width="14" height="32" rx="4" fill="#0f1218"/>
  <rect x="-8" y="-50" width="16" height="32" rx="3" fill="#3a4458"/><rect x="-26" y="-58" width="52" height="10" rx="3" fill="#FF7A1A"/>
  <rect x="-24" y="-66" width="6" height="12" fill="#9aa4b4"/><rect x="18" y="-66" width="6" height="12" fill="#9aa4b4"/>
 </g>
</svg>
