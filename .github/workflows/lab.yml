# COCO Lab: coco_lab without ROS, the lab_web site, and its Pages deploy.
#
# Separate from ci.yml (the ROS workflow), which this file does not touch.
# The deploy job runs only on an explicitly confirmed manual dispatch on main.
# It only succeeds once the
# repository's Pages source is set to "GitHub Actions" (an owner action:
# Settings -> Pages). See docs/labs/PHASE_1D_PLAN.md section I.
name: Lab

on:
  push:
    branches: [ lab1, main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY after the real-phone and five-person usability gates pass'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coco-lab-venv:
    name: coco_lab in a plain venv (no ROS)
    runs-on: ubuntu-24.04
    # Slowest GREEN run of this job, measured 2026-10-02 over every
    # successful run on coco-labs and coco-robot-jazzy-2.0: 1.4 min
    # (median 1.1-1.2). The limit is generous so a slow mirror is not
    # killed, and finite so a hang is: two runs on 2026-10-01 sat in
    # 'Setup ROS 2 Jazzy' for ~2 h until cancelled by hand.
    # G1 (2026-10-22): the game replays made the green run 16 min (run
    # 39635640420); G1.12's rounds tests were cut off at 20, so 30.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install coco_lab and its pinned test requirements
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          # install from a copy: an in-tree pip build leaves build/ behind,
          # which ament_flake8 would then lint (SESSION_LOG 1B-0)
          cp -r coco_lab "$RUNNER_TEMP/coco_lab_src"
          # setuptools: test_dependencies.py::test_setup_py_runs_through_a_symlink
          # executes setup.py, and a Python 3.12 venv ships without it.
          # 84.0.0 = the local plain venv's (measured, 1D-7; CI run 36661285245
          # failed that one test without it)
          "$RUNNER_TEMP/venv/bin/pip" install setuptools==84.0.0 "$RUNNER_TEMP/coco_lab_src" -r coco_lab/requirements-test.txt
      - name: Test (the three ament linters need ament; the colcon route runs them)
        working-directory: coco_lab
        run: |
          # G1.11 (Gautham, 2026-10-21): tests marked gz need the gz CLI, which this job does
          # not have; they run on the laptop. Deselected, so the no-skip guard below holds.
          "$RUNNER_TEMP/venv/bin/python" -P -m pytest -q -p no:cacheprovider -m "not gz" \
            --ignore=test/test_copyright.py --ignore=test/test_flake8.py --ignore=test/test_pep257.py \
            --junitxml="$RUNNER_TEMP/coco_lab.xml"
      - name: Fail if tests vanished or were skipped
        run: |
          python - "$RUNNER_TEMP/coco_lab.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          r = ET.parse(sys.argv[1]).getroot()
          s = r if r.tag == 'testsuite' else next(r.iter('testsuite'))
          total, skipped = int(s.get('tests')), int(s.get('skipped', 0))
          bad = int(s.get('failures', 0)) + int(s.get('errors', 0))
          print(f'coco_lab: {total} collected, {skipped} skipped, {bad} failed/errored')
          # 333 = the pip-route count measured at 1D-0 (docs/SESSION_LOG.md)
          sys.exit(1 if total < 333 or skipped or bad else 0)
          PY

  lab-web:
    name: lab_web (tools, decoder, site build)
    runs-on: ubuntu-24.04
    # Slowest GREEN run of this job, measured 2026-10-02 over every
    # successful run on coco-labs and coco-robot-jazzy-2.0: 1.3 min
    # (median 1.0-1.1). The limit is generous so a slow mirror is not
    # killed, and finite so a hang is: two runs on 2026-10-01 sat in
    # 'Setup ROS 2 Jazzy' for ~2 h until cancelled by hand. M2.10 added the
    # v1 archive build (~2 min), so 20 -> 30; M3.0 replaced it with a fetch.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Python environment (coco_lab, pytest; no ROS)
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          cp -r coco_lab "$RUNNER_TEMP/coco_lab_src"
          "$RUNNER_TEMP/venv/bin/pip" install "$RUNNER_TEMP/coco_lab_src" -r coco_lab/requirements-test.txt
      - name: Python half of the cross-language tests
        run: |
          "$RUNNER_TEMP/venv/bin/python" -P -m pytest -q -p no:cacheprovider lab_web/tools \
            --junitxml="$RUNNER_TEMP/tools.xml"
          python - "$RUNNER_TEMP/tools.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          r = ET.parse(sys.argv[1]).getroot()
          s = r if r.tag == 'testsuite' else next(r.iter('testsuite'))
          total, skipped = int(s.get('tests')), int(s.get('skipped', 0))
          print(f'lab_web/tools: {total} collected, {skipped} skipped')
          sys.exit(1 if total < 58 or skipped else 0)
          PY
      - name: Site data (every bundle validated and replayed by coco_lab; the wheel)
        run: "$RUNNER_TEMP/venv/bin/python lab_web/tools/build_catalog.py"
      - uses: actions/setup-node@v7
        with:
          node-version-file: lab_web/.nvmrc
          cache: npm
          cache-dependency-path: lab_web/package-lock.json
      - name: Install (lockfile, exact pins)
        working-directory: lab_web
        run: npm ci
      - name: coco_schemas' TypeScript is what protoc generates today
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends protobuf-compiler
          python3 coco_schemas/scripts/generate.py --lang ts --check
      - name: Typecheck and the TypeScript tests
        working-directory: lab_web
        run: |
          node --version && npm --version
          npm run typecheck
          # the Arena runtime test boots Pyodide on these (M1.5)
          npm run arena-assets
          npm test
      # G1.8: CPython (the installed coco_lab) and Pyodide (the shipped packs) must agree
      # under state hash v3 -- global families exact, continuous families within 1e-9:
      # M5's four-arm control and localisation Compare loops, every global planner, and
      # every tick's hash of a Fetch Rush session on the Depot
      - name: Native vs Pyodide gate (state hash v3)
        working-directory: lab_web
        run: node tools/g1/native_gate.mjs --python "$RUNNER_TEMP/venv/bin/python" --out "$RUNNER_TEMP/native_gate.json"
      # M3.6: every committed Play link (scored by Chromium's page, docs/v2/data/m3/m36/)
      # re-scored in Node by `coco verify` -- the same coco_lab.play, under Pyodide -- must
      # give exactly the result hash the browser gave
      - name: coco verify, the 100 committed Play links
        working-directory: lab_web
        run: |
          node tools/coco.mjs verify --file ../docs/v2/data/m3/m36/links.json
          # the thresholds are computed in CPython; every reference must earn its stars in Pyodide
          node tools/play_reference_check.mjs
      - name: Build twice; the two builds must be identical
        working-directory: lab_web
        run: |
          npm run build
          first=$(node tools/check_dist.mjs | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).tree_sha256))")
          npm run build
          node tools/check_dist.mjs --expect-hash "$first"
      # M3.0: the frozen v1 site is a BUILT ARTIFACT (owner's decision
      # 2026-10-10; docs/v2/adr/0003-v1-archive.md): built once from 9f58b83,
      # Pyodide self-hosted, committed to the orphan branch v1-site. The
      # deploy copies it at the commit pinned in fetch_v1_site.sh after
      # checking every file and the tree hash -- nothing is built here. The
      # build itself is re-checked weekly (v1_reproducible.yml). After the
      # identical-build check: vite empties dist on every build.
      - name: The frozen v1 site at /v1/ (v1-site at its pinned commit, verified)
        env:
          PYTHON: ${{ runner.temp }}/venv/bin/python
        run: lab_web/tools/fetch_v1_site.sh lab_web/dist/v1
      - uses: actions/upload-pages-artifact@v5
        with:
          path: lab_web/dist

  lab-web-browsers:
    # M1 B.4: cross-engine determinism and screenshot tests, in real browsers.
    # The first 10 recorded sessions (docs/v2/data/m1/determinism/) replayed by
    # the built site's own worker in Chromium, Firefox and WebKit must give the
    # committed Pyodide-in-Node per-tick hashes; the Arena's fixed scenes must
    # match the committed canvas screenshots (lab_web/test/screenshots/).
    name: lab_web in Chromium, Firefox and WebKit (determinism, screenshots)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Python environment (coco_lab; no ROS)
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          cp -r coco_lab "$RUNNER_TEMP/coco_lab_src"
          "$RUNNER_TEMP/venv/bin/pip" install "$RUNNER_TEMP/coco_lab_src" -r coco_lab/requirements-test.txt
      - name: Site data
        run: "$RUNNER_TEMP/venv/bin/python lab_web/tools/build_catalog.py"
      - uses: actions/setup-node@v7
        with:
          node-version-file: lab_web/.nvmrc
          cache: npm
          cache-dependency-path: lab_web/package-lock.json
      - name: Install, build, and the three browsers (with their system libraries)
        working-directory: lab_web
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium firefox webkit
      - name: The frozen v1 site at /v1/ (v1-site at its pinned commit; the URL forms below need it)
        env:
          PYTHON: ${{ runner.temp }}/venv/bin/python
        run: lab_web/tools/fetch_v1_site.sh lab_web/dist/v1
      # G1.8: an open page keeps its build across a deploy (M5 review's A/B probe, asserted):
      # openDocumentMixed false, "New version ready" with no forced reload, the old build's
      # cache kept while a page of it is open and deleted after, the model worker pinned
      - name: Update isolation (open page across a deploy)
        working-directory: lab_web
        run: node tools/update_isolation_check.mjs dist "$RUNNER_TEMP/update-isolation"
      - name: Serve the built site as Pages does (gzip, /coco-labs/)
        working-directory: lab_web
        run: |
          nohup node tools/perf/serve_dist.mjs --port 4174 > "$RUNNER_TEMP/serve.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4174/coco-labs/ > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:4174/coco-labs/ > /dev/null
      - name: Determinism across engines (10 recorded sessions, every tick)
        working-directory: lab_web
        run: |
          rec=../docs/v2/data/m1/determinism
          for b in chromium firefox webkit; do
            node tools/perf/determinism.mjs "$b" --sessions "$rec/sessions.json" --limit 10 --out "$RUNNER_TEMP/det"
          done
          node tools/perf/determinism.mjs compare --sessions "$rec/sessions.json" --limit 10 --ref "$rec" --out "$RUNNER_TEMP/det"
          cat "$RUNNER_TEMP/det/determinism.json"
      - name: Terrain determinism across engines (M4.3; 3 recorded World Spec v2 sessions, every tick)
        working-directory: lab_web
        run: |
          rec=../docs/v2/data/m4/m43/determinism
          for b in chromium firefox webkit; do
            node tools/perf/determinism.mjs "$b" --sessions "$rec/sessions.json" --limit 3 --out "$RUNNER_TEMP/det_terrain"
          done
          node tools/perf/determinism.mjs compare --sessions "$rec/sessions.json" --limit 3 --ref "$rec" --out "$RUNNER_TEMP/det_terrain"
          cat "$RUNNER_TEMP/det_terrain/determinism.json"
      - name: Screenshot tests (the Arena's fixed scenes, canvas only)
        working-directory: lab_web
        run: node tools/perf/screenshots.mjs check --out "$RUNNER_TEMP/shots"
      # G1.12: the chase camera never puts COCO under the HUD: COCO's projected box against every
      # HUD element's rectangle, 20 scripted poses, phone landscape (emulated) and desktop
      - name: Chase camera keeps COCO clear of the HUD (20 poses, phone landscape and desktop)
        working-directory: lab_web
        run: node tools/g1/chase_hud_check.mjs http://127.0.0.1:4174/coco-labs/ "$RUNNER_TEMP/chase_hud.json"
      - name: Every v1 URL form resolves, 0 console errors (M2.10)
        working-directory: lab_web
        run: node tools/perf/v1_links_check.mjs --site http://127.0.0.1:4174/coco-labs/ --out "$RUNNER_TEMP/v1links"
      # M4.10: an M4.7 change hid the runs list on every replay page, and no CI step looked
      - name: Every replay plays to its end with its badge, results and runs list (M2, M3 regressions)
        working-directory: lab_web
        run: node tools/perf/replay_check.mjs --site http://127.0.0.1:4174/coco-labs/ --out "$RUNNER_TEMP/replays"

  deploy:
    name: Deploy site
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY'
    needs: [ coco-lab-venv, lab-web, lab-web-browsers ]
    runs-on: ubuntu-24.04
    # Slowest GREEN run of this job, measured 2026-10-02 over every
    # successful run on coco-labs and coco-robot-jazzy-2.0: 0.2 min
    # (median 0.1). The limit is generous so a slow mirror is not
    # killed, and finite so a hang is: two runs on 2026-10-01 sat in
    # 'Setup ROS 2 Jazzy' for ~2 h until cancelled by hand.
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
