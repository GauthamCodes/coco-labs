# R2.6, R6.A7 · leaderboard entries re-verified: ONE JOB PER SUITE x ENTRY (a matrix), each within 1 hour.
#
# The single job this replaces ran every entry in turn and was cancelled at GitHub's 6 h limit on main
# (2026-11-22: 62096d1, 5a9f54d). Now `plan` (tools/r2/reverify_plan.py) lists only the entries whose recorded
# versions changed, or whose own inputs (suite file, world, submission) changed since they were verified
# (Gautham, 2026-11-28); each becomes its own job, in the same sandbox as leaderboard-verify. A job fails,
# naming its entry, when a recomputed result differs from the committed one (leaderboard/results/).
# Weekly, and on request (workflow_dispatch, all: true), every entry is re-verified, so a model change that kept
# every version is still caught.
name: Leaderboard re-verify

on:
  push:
    branches: [ main ]
    paths: [ 'coco_lab/**', 'worlds/**', 'tools/r2/leaderboard.py', 'tools/r2/reverify_plan.py',
             'tools/r2/verifier.Dockerfile', 'leaderboard/**', '.github/workflows/leaderboard-reverify.yml' ]
  schedule:
    - cron: '17 3 * * 0'      # Sundays 03:17 UTC: everything
  workflow_dispatch:
    inputs:
      all:
        description: 'Re-verify every entry (not only those whose versions or inputs changed)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0          # the commits entries were verified at
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - id: plan
        name: Which entries (versions or their own inputs changed; all, weekly or on request)
        run: |
          set -euo pipefail
          all=""
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ inputs.all }}" = true ]; then all=--all; fi
          python3 tools/r2/reverify_plan.py $all --out plan.json --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: reverify-plan
          path: plan.json

  reverify:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.suite }} / ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: The sandbox image
        run: docker build -q -t coco-verifier -f tools/r2/verifier.Dockerfile .
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: PyYAML for the trusted regeneration (as the verifier image pins it)
        run: python3 -m pip install --quiet PyYAML==6.0.1
      - name: Re-verify ${{ matrix.suite }}/${{ matrix.name }} (${{ matrix.mode }}, sample ${{ matrix.sample }})
        run: |
          set -uo pipefail
          suite='${{ matrix.suite }}'; name='${{ matrix.name }}'; mb='${{ matrix.merge_base }}'
          mode='${{ matrix.mode }}'; base='${{ matrix.baseline }}'; fam='${{ matrix.family }}'; sample='${{ matrix.sample }}'
          res="leaderboard/results/$suite/$name/result.json"
          out="$RUNNER_TEMP/re/$suite/$name"; mkdir -p "$out" && chmod 0777 "$out"
          cpus=$(nproc); echo "runner CPUs: $cpus" | tee "$out/timing.txt"
          start=$(date +%s); status=0
          sandbox="docker run --rm --network none --read-only --tmpfs /tmp:size=256m --cpus $cpus --memory 8g --memory-swap 8g --pids-limit 256 --cap-drop ALL --security-opt no-new-privileges --user 65534:65534 -v $out:/out"
          if [ "$mode" = bench ]; then
            # the procedure that made the entry: its baseline export's own runs, re-run in the sandbox (chains and
            # counts must match), then the entry rewritten from those records by the command that wrote it
            for part in public held_out; do
              $sandbox -v "$PWD/$base:/bench:ro" -e PYTHONPATH=/coco/coco_lab:/coco/coco_schemas:/coco/coco_config \
                --entrypoint python coco-verifier -P -m coco_lab.experiments verify "/bench/$part" \
                --algorithm "$name" --sample "$sample" --workers "$cpus" 2>&1 | tee -a "$out/verify.txt" || status=1
            done
            if [ "$name" = mcl_reference ]; then
              python3 tools/r2/leaderboard.py mcl-reference --root "$out/regen" > "$out/regen.log" 2>&1 || status=1
            else
              python3 tools/r2/leaderboard.py builtin-bench "$suite" "$fam" --root "$out/regen" > "$out/regen.log" 2>&1 || status=1
            fi
            python3 tools/r2/leaderboard_writer.py --compare "$res" "$out/regen/$suite/$name/result.json" || status=1
          else
            $sandbox -v "$PWD/leaderboard/submissions/$suite/$name:/submissions/$suite/$name:ro" coco-verifier verify "/submissions/$suite/$name" --out /out --merge-base "$mb" --workers "$cpus" || true
            python3 tools/r2/leaderboard_writer.py --compare "$res" "$out/result.json" || status=1
          fi
          echo "verify_seconds=$(( $(date +%s) - start )) sample=$sample mode=$mode" | tee -a "$out/timing.txt"
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reverify-${{ matrix.suite }}-${{ matrix.name }}
          path: ${{ runner.temp }}/re/
