# R2.6 · the leaderboard verifier (ADR 0012; leaderboard/CONTRIBUTING.md).
#
# UNTRUSTED code runs here, so: `pull_request` only (never pull_request_target) -- a fork's run
# gets a read-only token and no secrets; `contents: read`; the judge is the BASE branch's
# coco_lab and verifier (the pull request is checked out only as data); the algorithm runs in
# a container with --network none, a read-only root, no capabilities, an unprivileged user,
# CPU, memory and pid limits and a timeout. This job writes nothing anywhere: it uploads an
# artifact. The separate, trusted leaderboard-results.yml reads it and labels the PR.
name: Leaderboard verify

on:
  pull_request:
    branches: [ main, 'v2/r2-byoa' ]
    paths: [ 'leaderboard/submissions/**' ]

permissions:
  contents: read

concurrency:
  group: leaderboard-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify the submission (sandboxed)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: The base branch (its verifier and coco_lab are the judge)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: The pull request (data only)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
          fetch-depth: 0
      - name: Which submissions -- and nothing else changed
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          cd pr
          MB=$(git merge-base "$BASE_SHA" HEAD)
          echo "merge_base=$MB" >> "$GITHUB_OUTPUT"
          git diff --name-only "$MB" HEAD > "$RUNNER_TEMP/changed.txt"
          python3 - "$RUNNER_TEMP/changed.txt" "$RUNNER_TEMP/submissions.txt" <<'PY'
          import re, sys
          changed = [l for l in open(sys.argv[1]).read().split('\n') if l]
          ok = re.compile(r'^leaderboard/submissions/([a-z0-9-]+)/([a-z0-9][a-z0-9_-]{1,39})/(algorithm\.py|meta\.yaml|summary\.json)$')
          outside = [c for c in changed if not ok.match(c)]
          dirs = sorted({'/'.join(c.split('/')[:4]) for c in changed if ok.match(c)})
          open(sys.argv[2], 'w').write('\n'.join(dirs) + '\n')
          print('submissions:', dirs)
          if outside:
              print('::error::a submission PR changes only leaderboard/submissions/<suite>/<name>/'
                    '{algorithm.py,meta.yaml,summary.json}; also changed:', outside)
              sys.exit(1)
          if not dirs:
              sys.exit('no submission in this pull request')
          PY
      - name: The sandbox image (built from the base branch, before the network is taken away)
        run: docker build -q -t coco-verifier -f base/tools/r2/verifier.Dockerfile base
      - name: Verify in the sandbox
        env:
          MERGE_BASE: ${{ steps.scope.outputs.merge_base }}
        run: |
          set -uo pipefail
          mkdir -p out
          echo "{\"pr\": ${{ github.event.pull_request.number }}, \"head_sha\": \"${{ github.event.pull_request.head.sha }}\", \"merge_base\": \"$MERGE_BASE\"}" > out/run.json
          status=0
          while read -r dir; do
            [ -n "$dir" ] || continue
            suite=$(basename "$(dirname "$dir")"); name=$(basename "$dir")
            mkdir -p "out/$suite/$name" && chmod 0777 "out/$suite/$name"
            timeout 140m docker run --rm --network none --read-only --tmpfs /tmp:size=256m \
              --cpus 2 --memory 4g --memory-swap 4g --pids-limit 256 --cap-drop ALL \
              --security-opt no-new-privileges --user 65534:65534 \
              -v "$PWD/pr/$dir:/submissions/$suite/$name:ro" -v "$PWD/out/$suite/$name:/out" \
              coco-verifier verify "/submissions/$suite/$name" --out /out --merge-base "$MERGE_BASE" --workers 2 \
              || status=1
            cat "out/$suite/$name/report.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no report for $dir" >> "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/submissions.txt"
          exit $status
      - name: The verification (an artifact; read by the trusted leaderboard-results.yml)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leaderboard-verification
          path: out/
          retention-days: 90
