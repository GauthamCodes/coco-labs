name: CI

on:
  push:
    branches: [ main, develop, jazzy-harmonic-port ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    # Slowest GREEN run of this job, measured 2026-10-02 over every
    # successful run on coco-labs and coco-robot-jazzy-2.0: 44.3 min
    # (run 36930257226, almost all of it in 'Setup ROS 2 Jazzy' on a slow
    # mirror; median 5.2-5.8). It was 60 until that run showed 60 would
    # leave a slow mirror only 1.35x. The limit is generous so a slow
    # mirror is not killed, and finite so a hang is: two runs on
    # 2026-10-01 sat in that step for ~2 h until cancelled by hand.
    # No apt/ROS cache: ros-tooling/setup-ros@v0.7 has no cache input,
    # and caching /var/cache/apt by hand is not clean (root-owned, and
    # it saves only the download). Skipped deliberately.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ros-jazzy-xacro \
            ros-jazzy-ros2-controllers \
            ros-jazzy-gz-ros2-control \
            ros-jazzy-moveit-msgs \
            ros-jazzy-diagnostic-msgs \
            ros-jazzy-cv-bridge \
            ros-jazzy-nav2-bringup \
            ros-jazzy-ros-gz-sim \
            ros-jazzy-robot-localization \
            python3-opencv \
            python3-numpy \
            liburdfdom-tools
          # coco_rl's tests guard their imports with pytest.importorskip, so
          # without gymnasium they would skip silently and CI would report
          # green having run none of them. Torch/SB3 are not needed: the
          # tests cover the pure reward and env-helper maths, not training.
          # cv_bridge and opencv are the same trap for coco_perception:
          # target_finder imports both at module scope, so without them its
          # whole suite would vanish behind a collection error.
          # nav2-bringup and ros-gz-sim: gazebo_models' exec_depends, whose
          # installed launch files test_cmd_vel_wiring, test_episode_spawning
          # and test_no_turtlebot_dependency resolve (31 fail without them).
          # mujoco: coco_rl.yard_env and coco_sim import it at module scope,
          # so without it coco_rl's collection aborts (exit 2). The pin is
          # coco_sim/setup.py's install_requires.
          # tornado: coco_web's server. Pinned to the version its suite was
          # measured on (6.5.7); the tests encode 6.5 behaviour, e.g.
          # write_message returning a Task and IOStream._write_buffer.
          pip install --break-system-packages gymnasium mujoco==3.11.0 tornado==6.5.7

      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install \
            --packages-select gazebo_models custom_teleop coco_config coco_moveit_config coco_web coco_rl coco_perception coco_mission coco_sim

      - name: Validate robot model
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          xacro install/gazebo_models/share/gazebo_models/urdf/coco_robo2.xacro > /tmp/coco.urdf
          check_urdf /tmp/coco.urdf

      - name: Test
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          # coco_mission likewise: built, never tested. Its fixtures construct
          # real nodes, which is safe here -- a CI runner has no other graph.
          # coco_web was built but never tested here, so its suite could not
          # fail CI. That is how 917bc59's platform_bounds break -- every
          # browser connection dying before `welcome` -- stayed green: its
          # 575 tests ran only on developer machines, all on a stubbed
          # world_geometry. test_platform_server.py now runs the real one.
          colcon test --packages-select gazebo_models custom_teleop coco_config coco_moveit_config coco_rl coco_perception coco_sim coco_web coco_mission
          colcon test-result --verbose
          # colcon test exits 0 even when a package collected nothing, which
          # is exactly how the coco_rl suite went unnoticed: its tests use
          # pytest.importorskip, so a missing gymnasium made them vanish
          # while CI stayed green. Fail if the count drops below what the
          # tree actually has. ament_python writes pytest.xml, ament_cmake
          # writes *.xunit.xml -- both are needed.
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          files = sorted(set(glob.glob('build/**/pytest.xml', recursive=True)
                             + glob.glob('build/**/*.xunit.xml', recursive=True)))
          total = failures = 0
          for f in files:
              root = ET.parse(f).getroot()
              for s in ([root] if root.tag == 'testsuite' else root.iter('testsuite')):
                  total += int(s.get('tests', 0))
                  failures += int(s.get('failures', 0)) + int(s.get('errors', 0))
          print(f'collected {total} tests across {len(files)} suites, '
                f'{failures} failed/errored')
          if failures:
              sys.exit(1)
          # 245 collected locally across the seven packages as of M6. The
          # floor is just under the smallest package (coco_moveit_config,
          # 12) so losing any one suite trips it. It was 75, which no
          # longer meant anything -- and 75 would not have caught the
          # collection abort that was costing coco_moveit_config all five
          # of its arm_ik tests on every run.
          if total < 230:
              sys.exit(f'expected at least 230 tests, collected {total} -- '
                       'a suite skipped silently (missing dependency?)')
          PY
