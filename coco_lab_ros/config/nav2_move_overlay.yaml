# COCO Lab Phase 6 (Lab 5, Move) -- the lab-only controller overlay.
#
# Deep-merged by coco_lab_ros.params onto a COPY of
# gazebo_models/config/nav2_params.yaml, exactly like Phase 1C's
# nav2_lab_overlay.yaml; the mission's file is never edited (a test pins it
# byte-identical, and a test pins the merged diff to the keys below).
#
# Its ONLY change: controller_server loads two more controllers beside the
# mission's DWB, so one session can drive the SAME frozen path with any of
# the three by FollowPath's controller_id:
#
#   FollowPath  dwb_core::DWBLocalPlanner              the mission's, UNTOUCHED
#   MPPI        nav2_mppi_controller::MPPIController   Nav2 1.3.11 docs example
#   RPP         nav2_regulated_pure_pursuit_controller  Nav2 1.3.11 docs example
#
# Holding the robot fixed. Every value below is the Nav2 documentation's
# example configuration EXCEPT where the robot's own limits differ; those
# are set to the mission's DWB values so no controller gets a faster or
# more agile robot than another:
#
#   forward speed cap        0.3 m/s   (DWB max_vel_x)
#   no reversing             min 0.0   (DWB min_vel_x 0.0)
#   yaw-rate cap             1.0 rad/s (DWB max_vel_theta)
#   linear accel / decel     3.0 / -2.5 m/s^2 (DWB acc_lim_x / decel_lim_x)
#   yaw accel                3.2 rad/s^2 (DWB acc_lim_theta)
#
# and the controller period is the mission's (controller_frequency 10 Hz,
# shared by all three), so MPPI's model_dt is 0.1 s and its horizon keeps
# the docs' 2.8 s (28 x 0.1 instead of 56 x 0.05). Collision checking uses
# each controller's own mechanism on the SAME local costmap (robot_radius
# 0.25, C2-NAV.48). The goal and progress checkers are the mission's and
# are shared.
#
# Debug output, from the controllers themselves (no parallel outputs are
# invented): DWB's debug_trajectory_details (already on in the mission's
# block) publishes every scored candidate on /evaluation; MPPI visualize:
# true publishes sampled rollouts on /trajectories and its chosen sequence
# on /optimal_trajectory; RPP publishes /lookahead_point,
# /lookahead_collision_arc and /received_global_plan unconditionally.
controller_server:
  ros__parameters:
    controller_plugins: ["FollowPath", "MPPI", "RPP"]
    MPPI:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 28
      model_dt: 0.1
      batch_size: 2000
      ax_max: 3.0
      ax_min: -2.5
      ay_max: 3.0
      az_max: 3.2
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      vx_max: 0.3
      vx_min: 0.0
      vy_max: 0.5
      wz_max: 1.0
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: true
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic",
                "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
                "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        # false: the local costmap's footprint is a circle (robot_radius),
        # so the critic checks the inscribed radius, as DWB's does.
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
    RPP:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.3
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.0
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 10.0
      interpolate_curvature_after_goal: false
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
