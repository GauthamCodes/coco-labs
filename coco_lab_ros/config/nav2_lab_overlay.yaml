# COCO Lab Phase 1C -- the lab-only Nav2 parameter overlay.
#
# Deep-merged by coco_lab_ros.params onto a COPY of
# gazebo_models/config/nav2_params.yaml; the mission's file is never edited
# (a test pins it byte-identical to Phase 1B's e06dc94).
#
# Its ONLY change (tested: the merged file differs from the mission's in
# exactly these keys): register a third planner, NavFnAStar, so the
# conformance experiment can ask NavFn for its A* path by planner_id in the
# same session as its Dijkstra path. GridBased (SmacPlanner2D) and NavFn are
# untouched; the list replaces the mission's list, it is not appended to.
# NavFnAStar is NavFn's block with use_astar: true and nothing else changed.
planner_server:
  ros__parameters:
    planner_plugins: ["GridBased", "NavFn", "NavFnAStar"]
    NavFnAStar:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: false
