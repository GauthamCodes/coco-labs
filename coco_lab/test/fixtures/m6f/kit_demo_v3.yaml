# A small World Spec v3 level that uses every kit element once or more (M6F.1 tests).
# Not a game level: the Depot is worlds/coco_depot_v1.yaml. The robot block is the
# COCO arena's (worlds/coco_arena_v2.yaml), copied; a test asserts they agree.
spec_version: coco.world_spec.v3
id: kit_demo_v3
title: Level kit demo (14 x 10 m), every kit element
frame: world
world_to_map: [0, 0]
bounds: {x_min: 0, x_max: 14, y_min: 0, y_max: 10}
robot:
  wheel_radius: 0.0585
  wheel_separation: 0.274
  radius: 0.22
  ground_clearance: 0.0135
  limits:
    teleop_linear: 0.5
    teleop_angular: 1.2
    auto_linear: 0.3
    auto_angular: 1.0
    linear_accel: 2.0
    angular_accel: 4.0
  lidar:
    mount: [-0.09, 0.1, 0.2]
    samples: 480
    angle_min: -2.0944
    angle_max: 2.0944
    range_min: 0.15
    range_max: 12.0
start: {x: 2.0, y: 5.0, theta: 0.0}
arena: {resolution: 0.1, margin: 0.5, dt: 0.1, unknown: blocked}
catalog:
  - {id: test_can, label: Test can, shape: cylinder, diameter: 0.028, height: 0.158, magnetic: true, colour: blue, mass: 0.05}
  - {id: plastic_bottle, label: Plastic bottle, shape: cylinder, diameter: 0.024, height: 0.158, magnetic: false, colour: white, mass: 0.05}
  - {id: crate, label: Crate, shape: box, size: [0.3, 0.3, 0.3], magnetic: false, colour: brown, mass: 1.0}
kit:
  - {id: wall_s, kind: wall, from: [0, 0], to: [14, 0], thickness: 0.2, height: 2.0}
  - {id: wall_n, kind: wall, from: [0, 10], to: [14, 10], thickness: 0.2, height: 2.0}
  - {id: wall_w, kind: wall, from: [0, 0], to: [0, 10], thickness: 0.2, height: 2.0}
  - {id: wall_e, kind: wall, from: [14, 0], to: [14, 10], thickness: 0.2, height: 2.0}
  - {id: wall_mid, kind: wall, from: [7, 0], to: [7, 10], thickness: 0.2, height: 2.0}
  - {id: door_mid, kind: door, wall: wall_mid, at: 3.0, width: 1.0}
  - {id: rack_1, kind: rack, center: [3, 7], size: [4, 0.8], height: 3.0, aisle: 1.2, aisles: ['-y'], shelves: [0.4, 1.2, 2.0]}
  - {id: bench_1, kind: bench, center: [10, 8], size: [1.6, 0.7], height: 0.75}
  - {id: pallet_1, kind: pallet, center: [11, 2], size: [1.2, 1.0], height: 1.1}
  - {id: ramp_1, kind: ramp, foot: [8.5, 5.0], yaw: 0, run: 2, rise: 0.649839392466, width: 2.5, onto: deck_1}
  - {id: deck_1, kind: platform, center: [11.5, 5.0], size: [2.0, 2.5], top: 0.649839392466}
  - {id: drop_1, kind: zone, role: drop, center: [1.5, 1.5], size: [2, 2], label: Drop zone}
  - {id: can_floor, kind: object, item: test_can, at: [4, 3]}
  - {id: bottle_bench, kind: object, item: plastic_bottle, at: [10, 8], support: bench_1}
  - {id: can_shelf, kind: object, item: test_can, at: [3, 7], support: rack_1, shelf: 1}
  - {id: can_deck, kind: object, item: test_can, at: [12, 5], support: deck_1}
  - {id: crate_floor, kind: object, item: crate, at: [5.5, 4.5]}
  - {id: walker_1, kind: actor, actor: walker, path: [[2, 2], [5.5, 2]], mode: pingpong, speed: 1.0, footprint: [0.5, 0.5], height: 1.7}
  - {id: forklift_1, kind: actor, actor: forklift, path: [[8, 0.9], [13, 0.9]], mode: pingpong, speed: 1.5, footprint: [1.8, 0.9], height: 2.0, phase: 1.0}
